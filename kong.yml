_format_version: "3.0"
services:
  - name: scriptum-auth
    url: http://scriptum-auth-{{AMBIENTE}}:10000
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: false

  - name: scriptum-note-manager
    url: http://scriptum-note-manager-{{AMBIENTE}}:10000
    routes:
      - name: documentos-route
        paths:
          - /documentos
        strip_path: false
    plugins:
      - name: jwt 

  
  - name: scriptum-ocr
    url: https://scriptum-ocr-{{AMBIENTE}}.onrender.com
    routes:
      - name: ocr-route
        paths:
          - /ocr
        strip_path: false
    plugins:
      - name: jwt

consumers:
  - username: scriptum-client
    jwt_secrets:
      - key: scriptum-issuer
        secret: scriptum-chave-secreta-super-segura-32-bytes
        algorithm: HS256