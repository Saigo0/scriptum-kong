name: CI/CD Pipeline - Kong Gateway

on:
  push:
    branches:
      - main
      - 'release/**'

jobs:
  implantar-homol:
    name: Publicar e Implantar (Homol)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Preparar tags (HOMOL)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/scriptum-kong
          tags: |
            type=raw,value=v${{ env.DOCKER_TAG_VERSION }}-homol
      
        
        #teste

        
      - name: Injetar ambiente no kong.yml (Homol)
        run: sed -i 's/{{AMBIENTE}}/homol/g' kong.yml 
        
      - name: Injetar variáveis no kong.yml (Homol)
        env:
          URL_OCR: ${{ secrets.OCR_URL_HOMOL }}
          URL_AUTH: ${{ secrets.AUTH_URL_HOMOL }}
          URL_NOTE: ${{ secrets.NOTE_URL_HOMOL }}
        run: |
          sed -i "s|{{URL_OCR}}|$URL_OCR|g" kong.yml
          sed -i "s|{{URL_AUTH}}|$URL_AUTH|g" kong.yml
          sed -i "s|{{URL_NOTE}}|$URL_NOTE|g" kong.yml
          cat kong.yml

      - name: Construir e enviar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Atualizar ambiente no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_HOMOL_DEPLOY_HOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --get "$RENDER_DEPLOY_HOOK_URL"

  implantar-prod:
    name: Publicar e Implantar (Prod)
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extrair versão da branch de release
        run: |
          # Pega a versão direto do nome da branch (ex: release/1.1.0 vira 1.1.0)
          BRANCH_NAME="${{ github.ref_name }}"
          VERSION="${BRANCH_NAME#release/}"
          echo "DOCKER_TAG_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Preparar tags (PROD)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/scriptum-kong
          tags: |
            type=raw,value=v${{ env.DOCKER_TAG_VERSION }}-prod

      - name: Injetar ambiente no kong.yml (Prod)
        run: sed -i 's/{{AMBIENTE}}/prod/g' kong.yml

      - name: Injetar variáveis no kong.yml (Prod)
        env:
          URL_OCR: ${{ secrets.OCR_URL_PROD }}
          URL_AUTH: ${{ secrets.AUTH_URL_PROD }}
          URL_NOTE: ${{ secrets.NOTE_URL_PROD }}
        run: |
          sed -i "s|{{URL_OCR}}|$URL_OCR|g" kong.yml
          sed -i "s|{{URL_AUTH}}|$URL_AUTH|g" kong.yml
          sed -i "s|{{URL_NOTE}}|$URL_NOTE|g" kong.yml

        #comentario pra teste
        #outro comentario pra teste
        #teste

      - name: Construir e enviar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Atualizar ambiente no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --get "$RENDER_DEPLOY_HOOK_URL"