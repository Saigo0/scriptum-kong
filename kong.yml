_format_version: "3.0"
services:
  - name: scriptum-auth
    url: {{URL_AUTH}}
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: false

  - name: scriptum-note-manager
    url: {{URL_NOTE}}
    routes:
      - name: documents-route
        paths:
          - /documents
        strip_path: false
      - name: categories-route
        paths:
          - /categories
        strip_path: false
    plugins:
      - name: jwt

  
  - name: scriptum-ocr
    url: {{URL_OCR}}
    routes:
      - name: ocr-route
        paths:
          - /ocr
        strip_path: false
    plugins:
      - name: jwt

consumers:
  - username: scriptum-client
    jwt_secrets:
      - key: scriptum-issuer
        secret: scriptum-chave-secreta-super-segura-32-bytes
        algorithm: HS256